<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services</title>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Our Professional Services</h1>
        <p>Explore what we offer below:</p>
        <ul>
            <li>Consulting Services</li>
            <li>Custom Development</li>
        </ul>
        
        <button id="promoBtn" data-url="products.html">View Service Promotions</button>
    </main>

    <!-- Issue #5: Fixed Link/Navigation Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const promoButton = document.getElementById("promoBtn");
            
            if (promoButton) {
                promoButton.addEventListener("click", function() {
                    const targetUrl = this.getAttribute("data-url");
                    // Fixed logic: Ensures the target URL exists before routing to prevent broken link errors
                    if (targetUrl) {
                        window.location.href = targetUrl;
                    } else {
                        console.error("Navigation error: Target URL is missing.");
                    }
                });
            }
        });
    </script>

</body>
</html>
